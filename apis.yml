aid: change
name: Change.org
description: >-
  Change.org is an independent, nonprofit-owned social-change platform where anyone
  can start, sign, and win petitions. With over 500 million users worldwide, it lets
  people launch campaigns on social, political, and community issues, collect signatures,
  engage decision makers, and reach the media to drive real-world outcomes. Surfaced as
  a portfolio company of Slow Ventures and profiled in the API Evangelist network. Change.org's
  historical public developer/petitions API has been deprecated and is no longer maintained;
  no first-party OpenAPI, SDK, or hosted MCP server is currently published.
